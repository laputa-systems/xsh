name: Lint

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint on Ubuntu
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pull pinned Linux test image
        run: |
          expected="$(sed -n '2p' dev/images.lock)"
          actual="$(sha256sum Dockerfile.test | cut -d ' ' -f 1)"
          test "$actual" = "$expected" || { echo 'stale image lock: run cargo dev image build, publish the layout, and repin dev/images.lock' >&2; exit 1; }
          image="$(sed -n '1p' dev/images.lock)"
          docker pull --platform linux/arm64 "$image"

      - name: Ensure XSH checks, lints and generated docs pass
        run: |
          docker run --rm --init --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_TARGET=aarch64-unknown-linux-musl \
            -e TARGET=aarch64-unknown-linux-musl \
            -e 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=+crt-static -C link-arg=--defsym=__isoc23_sscanf=sscanf -C link-arg=--defsym=__isoc23_strtol=strtol' \
            "$(sed -n '1p' dev/images.lock)" sh -ec '
              cargo build --release -p xsht --bin xsht
              target/aarch64-unknown-linux-musl/release/xsht check
              target/aarch64-unknown-linux-musl/release/xsht lint
              cargo dev docs check
            '

