name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Pull pinned Linux test image
        run: |
          expected="$(sed -n '2p' dev/images.lock)"
          actual="$(sha256sum Dockerfile.test | cut -d ' ' -f 1)"
          test "$actual" = "$expected" || { echo 'stale image lock: run cargo dev image build, publish the layout, and repin dev/images.lock' >&2; exit 1; }
          image="$(sed -n '1p' dev/images.lock)"
          docker pull --platform linux/arm64 "$image"

      - name: Allow unprivileged user namespaces
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      - name: Give the test user the checkout
        run: |
          mkdir -p .work/tmp
          sudo chown -R 1000:1000 .

      - name: Ensure Linux tests pass
        run: |
          docker run --rm --init --privileged --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_TARGET=aarch64-unknown-linux-musl \
            -e TARGET=aarch64-unknown-linux-musl -e DIST_PROFILE=verification \
            -e HOST_UID=1000 -e HOST_GID=1000 \
            -e 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=+crt-static -C link-arg=--defsym=__isoc23_sscanf=sscanf -C link-arg=--defsym=__isoc23_strtol=strtol' \
            "$(sed -n '1p' dev/images.lock)" cargo dev internal test-linux-ci

      - name: Return the checkout to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .
