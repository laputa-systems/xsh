name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Build pinned Linux test image
        run: docker build --platform linux/arm64 -t xsh-test -f Dockerfile.test .

      - name: Ensure Linux tests pass
        run: |
          docker run --rm --init --privileged --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_TARGET=aarch64-unknown-linux-musl \
            -e TARGET=aarch64-unknown-linux-musl -e DIST_PROFILE=dev \
            -e 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=+crt-static -C link-arg=--defsym=__isoc23_sscanf=sscanf -C link-arg=--defsym=__isoc23_strtol=strtol' \
            xsh-test cargo dev internal test-linux-ci
