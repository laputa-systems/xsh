name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: Package ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: x86_64-linux-musl
            arch: x86_64
            elf_machine: Advanced Micro Devices X86-64
            os: linux
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - package: aarch64-linux-musl
            arch: aarch64
            elf_machine: AArch64
            os: linux
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - package: aarch64-apple-darwin
            arch: aarch64
            os: darwin
            target: aarch64-apple-darwin
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      CFLAGS_x86_64_unknown_linux_musl: --target=x86_64-unknown-linux-musl
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-arg=--defsym=__isoc23_sscanf=sscanf -C link-arg=--defsym=__isoc23_strtol=strtol
      CFLAGS_aarch64_unknown_linux_musl: --target=aarch64-unknown-linux-musl
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-arg=--defsym=__isoc23_sscanf=sscanf -C link-arg=--defsym=__isoc23_strtol=strtol
      CFLAGS_aarch64_apple_darwin: -mcpu=apple-m1
      CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: -C target-cpu=apple-m1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install pinned Rust toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --component llvm-tools
          rustup default "$toolchain"
          rustup toolchain list | awk '{print $1}' | while read -r installed; do
            case "$installed" in
              "$toolchain"|"$toolchain"-*) ;;
              *) rustup toolchain uninstall "$installed" || true ;;
            esac
          done
          rustup toolchain list

      - uses: Swatinem/rust-cache@v2

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build optimized binary
        if: matrix.os == 'linux'
        run: make dist-Linux-docker TARGET=${{ matrix.target }} XSH_TEST_IMAGE=xsh-test XSH_TEST_IMAGE_BUILD=1

      - name: Build optimized Darwin binaries
        if: matrix.os == 'darwin'
        run: make dist TARGET=${{ matrix.target }}

      - name: Smoke-test product binaries
        run: |
          set -euo pipefail
          for bin in xsh xsht xshi; do
            path="target/${{ matrix.target }}/dist/${bin}"
            test -f "$path"
            test -x "$path"
            test -s "$path"
            if [ "${{ matrix.os }}" = linux ]; then
              test "$(od -An -t x1 -N 4 "$path" | tr -d ' \n')" = 7f454c46
              readelf -h "$path" | grep -F "Machine:" | grep -F "${{ matrix.elf_machine }}"
            fi
            "$path" --help
          done
          target/${{ matrix.target }}/dist/xsh --startup
          XSHI_ALLOW_NON_TTY_FOR_TESTS=1 target/${{ matrix.target }}/dist/xshi --no-config -c 'print "ok"'

      - name: Test
        run: |
          ci_target=linux; case ${{ matrix.os }} in darwin) ci_target=macos;; esac
          make test-${ci_target}-ci TARGET=${{ matrix.target }}

      - name: Verify static linkage
        if: matrix.os == 'linux'
        run: |
          "target/${{ matrix.target }}/dist/xsh" .github/scripts/release-verify-static.xsh -- \
            "${{ matrix.target }}" \
            xsh xsht xshi

      - name: Package Linux binaries
        if: matrix.os == 'linux'
        env:
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          "target/${{ matrix.target }}/dist/xsh" .github/scripts/release-package-linux.xsh -- \
            "$RELEASE_TAG" \
            "${{ matrix.target }}" \
            "${{ matrix.arch }}"

      - name: Package Darwin binaries
        if: matrix.os == 'darwin'
        env:
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          "target/${{ matrix.target }}/dist/xsh" .github/scripts/release-package-darwin.xsh -- \
            "$RELEASE_TAG" \
            "${{ matrix.target }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xsh-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create pre-release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Validate published artifact set
        env:
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          set -euo pipefail
          for artifact in \
            "xsh-${RELEASE_TAG}-x86_64-linux-musl" \
            "xsht-${RELEASE_TAG}-x86_64-linux-musl" \
            "xshi-${RELEASE_TAG}-x86_64-linux-musl" \
            "xsh-${RELEASE_TAG}-aarch64-linux-musl" \
            "xsht-${RELEASE_TAG}-aarch64-linux-musl" \
            "xshi-${RELEASE_TAG}-aarch64-linux-musl" \
            "xsh-${RELEASE_TAG}-aarch64-apple-darwin" \
            "xsht-${RELEASE_TAG}-aarch64-apple-darwin" \
            "xshi-${RELEASE_TAG}-aarch64-apple-darwin"; do
            test -f "dist/$artifact"
            chmod 0755 "dist/$artifact"
            test -x "dist/$artifact"
            test -s "dist/$artifact"
          done
      - name: Package core scripts
        env:
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          set -euo pipefail
          core_tar="dist/core-${RELEASE_TAG}.tar.xz"
          core_stage="$(mktemp -d)"
          trap 'rm -rf "$core_stage"' EXIT
          find core -path core/tests -prune -o -type f -name '*.xsh' -print \
            | sort \
            | while IFS= read -r source; do
                dest="$core_stage/${source%.xsh}"
                mkdir -p "$(dirname "$dest")"
                cp "$source" "$dest"
                chmod 0755 "$dest"
              done
          tar -C "$core_stage" -cJf "$core_tar" core
          test -s "$core_tar"
          sha256sum "$core_tar" > "dist/core-${RELEASE_TAG}.sha256"
          for archive in dist/*.tar.xz; do
            if test "$archive" != "$core_tar"; then
              echo "unexpected compressed artifact: $archive" >&2
              exit 1
            fi
          done

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG"
