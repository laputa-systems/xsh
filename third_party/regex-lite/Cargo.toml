# regex-lite 0.1.9 with two local changes: nfa.rs uses BTreeMap for capture
# names so compiling a regex does not call getrandom; pikevm.rs uses
# usize::MAX to avoid a deprecation warning in warning-deny builds.
[package]
name = "regex-lite"
version = "0.1.9"
edition = "2021"
rust-version = "1.65"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["std", "string"]
std = []
string = []

[lib]
name = "regex_lite"
path = "src/lib.rs"
