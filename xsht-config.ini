include = dev
module_path = .
  dev
exclude = target/**/*.xsh
  tools/archive-fat-trim-demo.xsh
  tests/fixtures/**/*.xsh
  # Catalog-owned embedded implementations. These are not user programs: they
  # are validated by the dedicated catalog gate in `src/stdlib.rs`, which runs
  # every embedded source through the production preparation pipeline (parse,
  # check declarations, probe bodies, lower, verify) whether or not any program
  # references it. Their helper bindings intentionally shadow standard module
  # names, which is a user-source rule that does not apply to implementations.
  stdlib/**/*.xsh
  # Standard-library-only benchmark fixtures, not a language corpus.
  bench/**/*.xsh
  # Documentation examples that must fail to check; `make docs-check` checks
  # each one for exactly the diagnostics its `# error: CODE` comments name.
  docs/snippets/*/rejected/*.xsh
  # The hand-written expansion of `repeat` that the SPEC shows and the
  # expansion parity test reads. `lint.prefer-repeat` would rewrite it into the
  # sugar it defines.
  docs/snippets/spec/46-repeat-expansion.xsh
test_roots = core/tests
  dev/tests
  tests
  showcase/tests

[lint]
# These default-on migrations stay quiet until the repository corpus is
# converted; remove each setting when its findings have been addressed.
prefer-env-string = false
prefer-item-shorthand = false
prefer-tempdir-scope = false
# Held off while the repository still carries redundant private effect clauses
# (`xsht lint --only lint.prefer-inferred-private-effects` lists them); delete
# this setting once they are removed so the default applies here too.
prefer-inferred-private-effects = false

[dead-code]
exclude = docs/snippets/**/*.xsh

[coverage]
exclude = core/tests/**/*.xsh
  tests/**/*.xsh
  showcase/tests/**/*.xsh
  examples/**/*.xsh
