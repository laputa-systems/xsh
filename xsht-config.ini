include = dev
module_path = .
  dev
  core
exclude = target/**/*.xsh
  # Immutable historical observer fixtures have current executable counterparts.
  dev/tests/test-consolidation-ratchets.xsh
  dev/consolidation_metrics.xsh
  tools/archive-fat-trim-demo.xsh
  dev/consolidation/evidence/**/*.xsh
  tests/fixtures/**/*.xsh
  core/tests/data/**/*.xsh
  # Catalog-owned embedded implementations. These are not user programs: they
  # are validated by the dedicated catalog gate in `src/stdlib.rs`, which runs
  # every embedded source through the production preparation pipeline (parse,
  # check declarations, probe bodies, lower, verify) whether or not any program
  # references it. Their helper bindings intentionally shadow standard module
  # names, which is a user-source rule that does not apply to implementations.
  stdlib/**/*.xsh
  # Standard-library-only benchmark fixtures, not a language corpus.
  bench/**/*.xsh
  # Documentation examples that must fail to check; `make docs-check` checks
  # each one for exactly the diagnostics its `# error: CODE` comments name.
  docs/snippets/*/rejected/*.xsh
  # Erased annotation probes the checker rejects: an unqualified variant gives
  # a pure no return type. Their qualified counterpart checks.
  dev/performance/corpus/witnesses/constructor-unique.erased.xsh
  dev/performance/corpus/witnesses/constructor-shared-invalid.erased.xsh
test_roots = core/tests
  dev/tests
  tests
  showcase/tests

[lint]
# These default-on migrations stay quiet until the repository corpus is
# converted; remove each setting when its findings have been addressed.
prefer-env-string = false
prefer-item-shorthand = false
prefer-tempdir-scope = false
# Held off while the repository still carries redundant private effect clauses
# (`xsht lint --only lint.prefer-inferred-private-effects` lists them); delete
# this setting once they are removed so the default applies here too.
prefer-inferred-private-effects = false

[dead-code]
exclude = docs/snippets/**/*.xsh

# Documentation examples show the `message: Str` payload on purpose.
[lint.prefer-implicit-message]
exclude = docs/snippets/**/*.xsh

# A pattern binding that reuses its scrutinee name is the subject of that test.
[lint.shadowing]
exclude = tests/xsh/generic-pattern-conditions.xsh

# The empty body is what the first fixture checks; the witnesses differ only
# in how the checker infers their shared signature.
[lint.unused-local]
exclude = tests/xsh/generic-proc-statement-bodies.xsh
  dev/performance/corpus/witnesses/source-read.*.xsh

# Default-on migrations stay quiet until the corpus is converted; remove a
# section when its findings have been addressed.
[lint.redundant-propagation]
exclude = **/*.xsh

