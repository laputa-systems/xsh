include = dev
module_path = .
  dev
  core
exclude = target/**/*.xsh
  tools/archive-fat-trim-demo.xsh
  tests/fixtures/**/*.xsh
  # A verbatim Laputa fragment that test_matrix.py reads as oracle data.
  dev/performance/oracle_mutants/**/*.xsh
  core/tests/data/**/*.xsh
  # Catalog-owned embedded implementations. These are not user programs: they
  # are validated by the dedicated catalog gate in `src/stdlib.rs`, which runs
  # every embedded source through the production preparation pipeline (parse,
  # check declarations, probe bodies, lower, verify) whether or not any program
  # references it. Their helper bindings intentionally shadow standard module
  # names, which is a user-source rule that does not apply to implementations.
  stdlib/**/*.xsh
  # Standard-library-only benchmark fixtures, not a language corpus.
  bench/**/*.xsh
  # Documentation examples that must fail to check; `make docs-check` checks
  # each one for exactly the diagnostics its `# error: CODE` comments name.
  docs/snippets/*/rejected/*.xsh
  # Erased annotation probes the checker rejects: an unqualified variant gives
  # a pure no return type. Their qualified counterpart checks.
  dev/performance/corpus/witnesses/constructor-unique.erased.xsh
  dev/performance/corpus/witnesses/constructor-shared-invalid.erased.xsh
test_roots = core/tests
  dev/tests
  tests
  showcase/tests

[lint]
# These default-on migrations stay quiet until the repository corpus is
# converted; remove each setting when its findings have been addressed.
prefer-env-string = false
prefer-item-shorthand = false
prefer-tempdir-scope = false
# Held off while the repository still carries redundant private effect clauses
# (`xsht lint --only lint.prefer-inferred-private-effects` lists them); delete
# this setting once they are removed so the default applies here too.
prefer-inferred-private-effects = false

[dead-code]
exclude = docs/snippets/**/*.xsh
# Published libraries: `stdlib` ships with XSH, `core/lib` is imported by
# programs outside this checkout, and `core/tests/support` is imported by
# fixture programs and by Laputa's guest entries. An export that no in-repo
# module uses is still interface there, not dead code.
public-api = stdlib/**/*.xsh
  core/lib/**/*.xsh
  core/tests/support/**/*.xsh

# Documentation examples show the `message: Str` payload on purpose.
[lint.prefer-implicit-message]
exclude = docs/snippets/**/*.xsh

# SPEC examples name the error family on purpose where they explain variants.
[lint.prefer-inferred-variant]
exclude = docs/snippets/spec/**/*.xsh

# A pattern binding that reuses its scrutinee name is the subject of that test.
[lint.shadowing]
exclude = tests/xsh/generic-pattern-conditions.xsh

# The empty body is what the first fixture checks; the witnesses differ only
# in how the checker infers their shared signature.
[lint.unused-local]
exclude = tests/xsh/generic-proc-statement-bodies.xsh
  dev/performance/corpus/witnesses/source-read.*.xsh
  # include_str! corpus for the formal bridge verifier; its unused bindings
  # and dead calls are the subject of the analyzer tests, not mistakes.
  formal/tests/fixtures/assigned-calls.xsh

# The completions test checks inference over `return Err(...)` forms; `fail`
# would remove the form it exists to check.
[lint.prefer-fail]
exclude = tests/xsh/inferred-pure-result-completions.xsh

[lint.unused-callable]
# See the unused-local note above: the verifier corpus keeps the calls it
# exists to check.
exclude = formal/tests/fixtures/assigned-calls.xsh

# The stage contract is consumed through a `module { ... }` contract by test
# programs written as strings, which a static workspace scan cannot follow. Its
# exports are live.
[lint.unused-export]
exclude = dev/stage_contract.xsh

[lint.redundant-command-interpolation]
exclude = dev/performance/corpus/witnesses/empty-list-accumulator.annotated.xsh
  dev/performance/corpus/witnesses/empty-list-accumulator.erased.xsh
  dev/performance/corpus/witnesses/interpolation-2850.annotated.xsh
  dev/performance/corpus/witnesses/interpolation-2850.erased.xsh
  dev/performance/corpus/witnesses/recursive-pure-parameter.annotated.xsh
  dev/performance/corpus/witnesses/recursive-pure-parameter.erased.xsh
  dev/performance/corpus/witnesses/recursive-pure-return.annotated.xsh
  dev/performance/corpus/witnesses/recursive-pure-return.erased.xsh

[lint.prefer-positional-constructor]
exclude = docs/snippets/api/core-records.xsh
  docs/snippets/api/field-labels.xsh
  docs/snippets/guide/02-values.xsh
  docs/snippets/guide/08-hosts.xsh
  docs/snippets/spec/05-record-defaults.xsh
  docs/snippets/spec/20-fallback-handler.xsh
  docs/snippets/spec/43-positional-constructors.xsh
  docs/snippets/spec/48-unless.xsh
  docs/snippets/spec/49-union-types.xsh
  docs/snippets/spec/66-callable-types.xsh
  tests/xsh/record-exactness.xsh

[lint.redundant-bare-return]
exclude = tests/xsh/generic-proc-bare-returns.xsh

[lint.prefer-callable-alias]
exclude = tests/xsh/match-exhaustive.xsh

# Default-on migrations stay quiet until the corpus is converted; remove a
# section when its findings have been addressed.
[lint.pattern-conditional]
exclude = **/*.xsh

