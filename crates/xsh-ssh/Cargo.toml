[package]
name = "xsh-ssh"
version = "0.0.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
data-encoding = "2.10"
graviola = { path = "vendor/graviola" }
oxish-graviola = { path = "vendor/oxish-graviola" }
oxish-proto = { path = "vendor/oxish-proto" }
rustix = { version = "1.1.4", features = ["event", "time"] }

[dev-dependencies]
sha2 = "0.11"
tempfile = "3"
