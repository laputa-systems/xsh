[package]
name = "xsh-net"
version = "0.0.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
async-executor = "1"
async-io = "2"
async-net = "2"
crossbeam-channel = "0.5"
futures-lite = { version = "2", default-features = false, features = ["race", "std"] }
h12tiny-client = { version = "0.1", default-features = false, features = ["http1", "http2", "tls"] }
http = "1"
http-body-util = "0.1"
hyper = { package = "laputa-hyper-futures-lite", version = "=1.11.0-beta.0", default-features = false, features = ["client", "http1", "http2"] }
libc = "0.2"
rustix = { version = "1.1.4", features = ["net"] }
rustc-hash = "2.1.3"
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
rustls-pemfile = "2"

[target.'cfg(target_os = "macos")'.dependencies]
rustls-platform-verifier = "0.7.0"
