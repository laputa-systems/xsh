[package]
name = "xsh-net"
version = "0.0.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
async-executor = "1"
async-io = "2"
cap-net-ext = "4.0.2"
cap-std = "4.0.2"
crossbeam-channel = "0.5"
futures-lite = { version = "2", default-features = false, features = ["race", "std"] }
h12tiny-client = { git = "https://github.com/laputa-systems/h12tiny", rev = "282aae5a33244a4dc7fac58d8453bc4abfd24d4c", default-features = false, features = ["http1", "http2", "tls"] }
http = "1"
http-body-util = "0.1"
hyper = { package = "laputa-hyper-futures-lite", version = "1.11.0", default-features = false, features = ["client", "http1", "http2"] }
libc = "0.2"
rustc-hash = "2.1.3"
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"
rustls-pemfile = "2"

[target.'cfg(target_os = "macos")'.dependencies]
rustls-platform-verifier = "0.7.0"
