[package]
name = "xsh-net"
version = "0.0.1"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1"
cap-net-ext = "4.0.2"
cap-std = "4.0.2"
crossbeam-channel = "0.5"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "rustls-platform-verifier", "tls12"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
libc = "0.2"
rustc-hash = "2.1.2"
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pemfile = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "time"] }
tower-service = "0.3"
