[package]
name = "xshi"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
libc = { version = "0.2", optional = true }
mimalloc = { version = "0.1.52", optional = true }
rustc-hash = { version = "2.1.3", optional = true }
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "runtime", "stdio", "system", "termios", "time"], optional = true }
sha2 = { version = "0.11", optional = true }
xsh = { path = "../..", default-features = false, features = ["net", "tools"], optional = true }

[features]
default = []
benchmark = []
# Laputa's Asterinas guest opts into the restored interactive shell while
# ordinary XSH builds keep the small disabled stub.
laputa-asterinas = ["dep:libc", "dep:mimalloc", "dep:rustc-hash", "dep:rustix", "dep:sha2", "dep:xsh"]

[dev-dependencies]
rustybench = "0.1"
tempfile = "3"

[[bench]]
name = "bench"
harness = false
required-features = ["benchmark", "laputa-asterinas"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["laputa-asterinas"]

[[test]]
name = "stdlib_preparation"
path = "tests/stdlib_preparation.rs"
required-features = ["laputa-asterinas"]

[lints.clippy]
nursery = { level = "allow", priority = -2 }
pedantic = { level = "allow", priority = -2 }
complexity = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -2 }
perf = { level = "deny", priority = -2 }
restriction = { level = "allow", priority = -2 }
suspicious = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = { level = "allow", priority = 0 }
wildcard_imports = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
