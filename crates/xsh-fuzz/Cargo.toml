[package]
name = "xsh-fuzz"
version = "0.0.1"
edition = "2024"
publish = false
autotests = false

[dependencies]
rustix = { version = "1.1.4", features = ["process"] }
libc = "0.2"
rustc-hash = "2.1.3"
tempfile = "3"
xsh = { path = "../..", default-features = false, features = ["net", "tools"] }
xsh-registry = { path = "../xsh-registry" }
xsht = { path = "../xsht" }

[[bin]]
name = "xsh-fuzz"
path = "src/main.rs"
test = false

[[test]]
name = "soundness"
path = "tests/soundness.rs"

[lints]
workspace = true
