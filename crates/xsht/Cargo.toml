[package]
name = "xsht"
version = "0.0.1"
edition = "2024"
publish = false
# Keep api, cli, desugar, and lint in one integration binary instead of one per file.
autotests = false

[features]
default = ["native-tests"]
native-tests = ["xsh/default", "xsh-registry/native-tests"]

[dependencies]
deser = { package = "laputa-deser", version = "=0.10.3", registry = "mycrates", features = ["derive"] }
deser-json = { package = "laputa-deser-json", version = "=0.10.3", registry = "mycrates" }
crossbeam-channel = "0.5"
ignore = { package = "laputa-ignore", version = "=0.4.33", registry = "mycrates" }
libc = "0.2"
mimalloc = "0.1.52"
rustc-hash = "2.1.3"
rustix = { package = "laputa-rustix", version = "1.1.6", registry = "mycrates", features = ["fs", "process"] }
tempfile = "3"
xsh = { path = "../..", default-features = false, features = ["net", "tools"] }
xsh-registry = { path = "../xsh-registry" }

[target.'cfg(target_os = "linux")'.dependencies]
syscalls = { version = "0.8.1", default-features = false, features = ["aarch64", "x86_64"] }

[dev-dependencies]
sha2 = "0.11"

[[test]]
# The individual suites are included as modules by this single test binary.
name = "integration"
path = "tests/integration.rs"

[[test]]
# Needs both the debug and the release `xsh` binary, so it is its own target.
name = "profile_parity"
path = "tests/profile_parity.rs"

[lints.clippy]
nursery = { level = "allow", priority = -2 }
pedantic = { level = "allow", priority = -2 }
complexity = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -2 }
perf = { level = "deny", priority = -2 }
restriction = { level = "allow", priority = -2 }
suspicious = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = { level = "allow", priority = 0 }
wildcard_imports = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
result_large_err = { level = "allow", priority = 1 }
