allow-dbg-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-useless-vec-in-tests = true
disallowed-types = [
    { path = "std::collections::HashMap", reason = "use rustc_hash::FxHashMap, the repo's hash map convention" },
    { path = "std::collections::HashSet", reason = "use rustc_hash::FxHashSet, the repo's hash set convention" },
]
