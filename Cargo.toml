[package]
name = "xsh"
version = "0.0.1"
edition = "2024"
publish = false
# Keep the integration suites in explicit aggregator targets below; otherwise
# Cargo discovers every tests/*.rs file as a separate test binary.
autotests = false

[workspace]
members = [
    "crates/xsh-applets",
    "crates/xsh-net",
    "crates/xsh-registry",
    "crates/xsh-root",
    "crates/xshi",
    "crates/xsht",
]

[workspace.lints.clippy]
nursery = { level = "allow", priority = -2 }
pedantic = { level = "allow", priority = -2 }
complexity = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -2 }
perf = { level = "deny", priority = -2 }
restriction = { level = "allow", priority = -2 }
suspicious = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = { level = "allow", priority = 0 }
wildcard_imports = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
result_large_err = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
type_complexity = { level = "allow", priority = 1 }

[lints.clippy]
nursery = { level = "allow", priority = -2 }
pedantic = { level = "allow", priority = -2 }
complexity = { level = "deny", priority = -2 }
correctness = { level = "deny", priority = -2 }
perf = { level = "deny", priority = -2 }
restriction = { level = "allow", priority = -2 }
suspicious = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = { level = "allow", priority = 0 }
wildcard_imports = { level = "deny", priority = 0 }
disallowed_types = { level = "deny", priority = 1 }
single_call_fn = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
result_large_err = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
type_complexity = { level = "allow", priority = 1 }

[lib]
name = "xsh"
path = "src/lib.rs"
doctest = false

[features]
default = ["native-tests", "net", "tools"]
benchmark = []
linux-priv-tests = []
native-tests = ["xsh-registry/native-tests"]
net = [
    "dep:xsh-net",
]
tools = []

[dependencies]
rawzip = "0.5.1"
tar = { version = "0.4.46", default-features = false }
bzip2 = "0.6.1"
crossbeam-channel = "0.5"
libc = "0.2"
data-encoding = "2"
directories = "6.0.0"
bstr = { version = "1", default-features = false, features = ["std", "unicode"] }
diffy = { version = "0.5.0", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
ignore = "=0.4.25"
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "encoder", "xz", "optimization"] }
md-5 = "0.11"
memchr = "2"
miniserde = "0.1"
regex-lite = "0.1.9"
rustc-hash = "2.1.3"
rustix = { version = "1.1.4", features = [
    "event", "fs", "linux_5_11", "mount", "net", "param", "pipe", "process", "stdio", "system",
    "termios", "time",
] }
sha1 = "0.11"
sha2 = "0.11"
smallvec = "1.15.2"
tempfile = "3"
xsh-net = { path = "crates/xsh-net", optional = true }
xsh-registry = { path = "crates/xsh-registry" }
xsh-root = { path = "crates/xsh-root" }

[dev-dependencies]
async-io = "2"
bytes = "1"
futures-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
laputa-h2-futures-lite = { version = "=0.4.16-beta.0", default-features = false }
http = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
xsht = { path = "crates/xsht" }
rustls = { version = "0.23.41", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4.0"

[build-dependencies]
xsh-registry = { path = "crates/xsh-registry" }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1.52"
syscalls = { version = "0.8.1", default-features = false, features = ["aarch64", "x86_64"] }
xsh-applets = { path = "crates/xsh-applets" }

[[bin]]
name = "xsh"
path = "src/entrypoints/xsh_main.rs"
test = false

[[bin]]
name = "xsh-frontend-stats"
path = "src/entrypoints/frontend_stats.rs"
test = false

[[bin]]
name = "xsh-runtime-stats"
path = "src/entrypoints/runtime_stats.rs"
test = false

[[bin]]
name = "xsh-test-show-argv"
path = "tests/helpers/show_argv.rs"
test = false

[[bin]]
name = "xsh-test-show-env"
path = "tests/helpers/show_env.rs"
test = false

[[bin]]
name = "xsh-test-stat-path"
path = "tests/helpers/stat_path.rs"
test = false

[[bin]]
name = "xsh-test-emit-hex"
path = "tests/helpers/emit_hex.rs"
test = false

[[bin]]
name = "xsh-test-sleeper"
path = "tests/helpers/sleeper.rs"
test = false

[[bin]]
name = "xsh-test-session"
path = "tests/helpers/session.rs"
test = false

[[bin]]
name = "xsh-test-os-probe"
path = "tests/helpers/os_probe.rs"
test = false

[[bin]]
name = "xsh-test-show-fds"
path = "tests/helpers/show_fds.rs"
test = false

[[test]]
# The individual files are included as modules by this single test binary.
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "linux_priv"
path = "tests/linux_priv.rs"
required-features = ["linux-priv-tests"]

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "thin"
opt-level = 3
# Redundant: DIST_RUSTFLAGS in the Makefile already passes -Cpanic=immediate-abort
# for dist builds. Keeping it here would prevent cargo test --profile dist (the test
# harness needs catch_unwind).  Profile-guided install builds (make install-darwin,
# make install-linux) are dev tools and don't need panic=abort.
# panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
